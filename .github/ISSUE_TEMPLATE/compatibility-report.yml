name: Compatibility report
description: Tried nwe39x on a player or firmware version? Tell us how it went, good or bad.
title: "[compat] NW-E39x, firmware x.xx: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying it. Reports from players other than the one NW-E394 on Sony firmware 1.01
        that has been tested are the most useful thing you can send.

        **Please don't paste your serial number.** `nwe39x devinfo` prints it; leave that output out,
        or replace the serial with `XXXX`.
  - type: dropdown
    id: model
    attributes:
      label: Player
      options: [NW-E393, NW-E394, NW-E395, Other]
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Firmware version before you started
      description: What `uv run nwe39x status` reported, or what Unit Information on the player shows.
      placeholder: "1.01"
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: What you built and flashed
      description: The mod or command line, e.g. `--mod mods/theme-ice`, and whether you used `--allow-code-patches`.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: What happened
      options:
        - Installed and works as expected
        - Installed, but something looks or behaves wrong
        - "`flash` refused before touching the player"
        - The player didn't come back after the install
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you saw on the player and the tool's output (without the serial). Photos of the screen help.
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: I removed my player's serial number from anything I pasted.
          required: true
